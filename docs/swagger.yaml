basePath: /api/v1
definitions:
  models.Category:
    properties:
      company:
        $ref: '#/definitions/models.Company'
      companyID:
        type: integer
      desc:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  models.Company:
    properties:
      id:
        type: integer
      title:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for managing feature toggles, categories, and tags for authenticated
    companies.
  title: Feature Toggle Service API
  version: "1.0"
paths:
  /categories:
    get:
      description: Retrieves a list of all categories for the authenticated company
      produces:
      - application/json
      responses:
        "200":
          description: List of categories
          schema:
            properties:
              categories:
                items:
                  $ref: '#/definitions/models.Category'
                type: array
            type: object
        "500":
          description: Failed to retrieve categories
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List all categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Creates a new category for the authenticated company
      parameters:
      - description: Category data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.Category'
      produces:
      - application/json
      responses:
        "201":
          description: Created category
          schema:
            $ref: '#/definitions/models.Category'
        "400":
          description: Invalid request body
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Failed to create category
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create a new category
      tags:
      - categories
  /categories/{categoryID}:
    delete:
      description: Deletes a category by ID for the authenticated company
      parameters:
      - description: Category ID
        in: path
        name: categoryID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Category deleted successfully
        "404":
          description: Category not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Failed to delete category
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete a category
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Updates an existing category by ID for the authenticated company
      parameters:
      - description: Category ID
        in: path
        name: categoryID
        required: true
        type: string
      - description: Category update data
        in: body
        name: input
        required: true
        schema:
          properties:
            desc:
              type: string
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated category
          schema:
            $ref: '#/definitions/models.Category'
        "400":
          description: Invalid request body
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Category not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Failed to update category
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update a category
      tags:
      - categories
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
